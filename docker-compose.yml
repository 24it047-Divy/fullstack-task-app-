services:
  # ─── MongoDB ───────────────────────────────────────────────
  mongo:
    image: mongo:6
    container_name: taskpulse-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: taskdb
    volumes:
      - mongo_data:/data/db
    networks:
      - taskpulse-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ─── Backend (Node/Express) ─────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taskpulse-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/taskdb
      NODE_ENV: production
    ports:
      - "5000:5000"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - taskpulse-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ─── Frontend (React + Nginx) ───────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5000
    container_name: taskpulse-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - taskpulse-net

volumes:
  mongo_data:
    name: taskpulse-mongo-data

networks:
  taskpulse-net:
    name: taskpulse-network
    driver: bridge

